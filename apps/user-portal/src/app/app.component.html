<div class="shell">
	<aside class="sidebar">
		<div class="brand">
			<h1>User Portal</h1>
			<poc-badge color="green">Angular</poc-badge>
		</div>

		<nav class="nav">
			<a
				*ngFor="let item of nav"
				[routerLink]="item.path"
				routerLinkActive="active"
				class="nav-link"
			>
				<span>{{ item.icon }}</span>
				<span>{{ item.label }}</span>
			</a>
		</nav>
	</aside>

	<main class="content">
		<header class="topbar">
			<div>
				<strong>Retail Banking Workspace</strong>
				<p>Typed actions + shared UI components + Nx monorepo packages</p>
			</div>
			<poc-badge color="blue">POC</poc-badge>
		</header>

		<section class="page">
			<router-outlet></router-outlet>
		</section>
	</main>
</div>
